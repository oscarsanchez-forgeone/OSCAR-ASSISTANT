<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Oscar Assistant</title>
  <style>
    :root{--bg:#0b1020;--panel:#141b2d;--panel2:#1b2440;--text:#f8fafc;--muted:#9ca3af;--accent:#8b5cf6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);min-height:100vh}
    .app{max-width:540px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(92px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:grid;place-items:center;font-weight:800}
    .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.card{background:rgba(20,27,45,.88);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:16px;box-shadow:0 15px 35px rgba(0,0,0,.18)}.metric{font-size:28px;font-weight:800}.label{font-size:13px;color:var(--muted);margin-top:5px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title h2{font-size:17px;margin:0}.link{color:#c4b5fd;font-size:13px}
    .list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;gap:12px;background:rgba(27,36,64,.9);border:1px solid rgba(255,255,255,.06);padding:14px;border-radius:17px}.dot{width:12px;height:12px;border-radius:50%}.item-main{flex:1}.item-title{font-weight:650}.item-meta{color:var(--muted);font-size:12px;margin-top:4px}.done .item-title{text-decoration:line-through;color:#9ca3af}.check{width:28px;height:28px;border-radius:10px;border:1px solid rgba(255,255,255,.15);display:grid;place-items:center;background:transparent;color:white}.done .check{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.35)}
    .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:22px;border:0;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;font-size:34px;box-shadow:0 15px 35px rgba(79,70,229,.4)}
    .nav{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(8,12,24,.9);backdrop-filter:blur(18px);display:flex;justify-content:center}.nav-inner{max-width:540px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#94a3b8;font-size:12px}.nav button.active{color:#fff}
    .modal{position:fixed;inset:0;background:rgba(3,7,18,.72);display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{width:100%;max-width:540px;background:#111827;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h3{margin:0 0 15px;font-size:21px}.grid-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{border:1px solid rgba(255,255,255,.08);background:#1f2937;color:#fff;border-radius:18px;padding:18px;text-align:left;font-weight:650}.close{width:100%;margin-top:12px;padding:14px;border-radius:16px;border:0;background:#374151;color:#fff}
    label{font-size:13px;color:#cbd5e1;display:block;margin:12px 0 7px}input,textarea,select{width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#0f172a;color:white;padding:13px;font:inherit}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;margin-top:16px;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:white;font-weight:700}.switch{display:flex;justify-content:space-between;align-items:center;background:#1f2937;padding:12px;border-radius:14px;margin-top:12px}.empty{color:var(--muted);text-align:center;padding:30px 10px}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><h1>Oscar Assistant</h1><p id="dateText"></p></div><div class="avatar">OA</div></header>
  <div class="summary">
    <div class="card"><div class="metric" id="projectCount">0</div><div class="label">Proyectos</div></div>
    <div class="card"><div class="metric" id="taskCount">0</div><div class="label">Tareas pendientes</div></div>
    <div class="card"><div class="metric" id="noteCount">0</div><div class="label">Notas</div></div>
    <div class="card"><div class="metric" id="doneCount">0</div><div class="label">Completadas</div></div>
  </div>
  <div class="section-title"><h2>Actividad de hoy</h2><span class="link">Todo organizado</span></div>
  <div id="todayList" class="list"></div>
  <div class="section-title"><h2>Proyectos</h2><span class="link">Por empresa o idea</span></div>
  <div id="projectList" class="list"></div>
</div>
<button class="fab" id="fab">+</button>
<div class="nav"><div class="nav-inner"><button class="active">Inicio</button><button>Proyectos</button><button>Calendario</button><button>Ajustes</button></div></div>

<div class="modal" id="actionModal"><div class="sheet"><h3>Crear</h3><div class="grid-actions">
<button class="action" data-type="project">📁<br>Nuevo proyecto</button><button class="action" data-type="note">📝<br>Nueva nota</button><button class="action" data-type="task">✅<br>Nueva tarea</button><button class="action" data-type="reminder">🔔<br>Recordatorio</button>
</div><button class="close" data-close>Cerrar</button></div></div>

<div class="modal" id="formModal"><div class="sheet"><h3 id="formTitle">Crear</h3><form id="entryForm">
<input type="hidden" id="entryType">
<label>Título</label><input id="title" required placeholder="Escribe un título">
<div id="projectField"><label>Proyecto / Empresa</label><select id="projectSelect"></select></div>
<div id="detailsField"><label>Apunte o descripción</label><textarea id="details" placeholder="Escribe aquí..."></textarea></div>
<div class="row"><div><label>Color</label><select id="color"><option value="#ef4444">Rojo · Urgente</option><option value="#f59e0b">Naranja · Trabajo</option><option value="#eab308">Amarillo · Pendiente</option><option value="#22c55e">Verde · Personal</option><option value="#3b82f6">Azul</option><option value="#8b5cf6" selected>Morado · Ideas</option></select></div><div><label>Fecha</label><input type="date" id="dueDate"></div></div>
<div class="switch"><span>Guardar permanentemente</span><input type="checkbox" id="keep" checked style="width:auto"></div>
<button class="save" type="submit">Guardar</button></form><button class="close" data-close>Cerrar</button></div></div>
<script>
const KEY='oscarAssistantDataV1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"entries":[]}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const today=()=>new Date().toISOString().slice(0,10);
function cleanup(){data.entries=data.entries.filter(e=>e.keep||e.date===today());save();}
function fmtDate(){return new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}
document.getElementById('dateText').textContent=fmtDate();
function render(){cleanup();
 document.getElementById('projectCount').textContent=data.projects.length;
 const tasks=data.entries.filter(e=>e.type==='task');
 document.getElementById('taskCount').textContent=tasks.filter(e=>!e.done).length;
 document.getElementById('doneCount').textContent=tasks.filter(e=>e.done).length;
 document.getElementById('noteCount').textContent=data.entries.filter(e=>e.type==='note'||e.type==='reminder').length;
 const list=document.getElementById('todayList'); const entries=data.entries.filter(e=>!e.date||e.date===today()).slice().reverse();
 list.innerHTML=entries.length?'': '<div class="empty">Aún no tienes actividad para hoy.</div>';
 entries.forEach(e=>{const el=document.createElement('div');el.className='item '+(e.done?'done':'');
 el.innerHTML=`<div class="dot" style="background:${e.color}"></div><div class="item-main"><div class="item-title">${escapeHtml(e.title)}</div><div class="item-meta">${escapeHtml(e.projectName||'Sin proyecto')} · ${e.keep?'Guardado':'Solo por hoy'}</div></div>${e.type==='task'?`<button class="check" data-id="${e.id}">${e.done?'✓':''}</button>`:''}`;list.appendChild(el)});
 document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{const e=data.entries.find(x=>x.id===b.dataset.id);e.done=!e.done;save();render();});
 const pl=document.getElementById('projectList');pl.innerHTML=data.projects.length?'':'<div class="empty">Crea tu primer proyecto o empresa.</div>';
 data.projects.forEach(p=>{const count=data.entries.filter(e=>e.projectId===p.id).length;const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="dot" style="background:${p.color}"></div><div class="item-main"><div class="item-title">${escapeHtml(p.title)}</div><div class="item-meta">${count} elementos</div></div>`;pl.appendChild(el)});
}
function escapeHtml(s=''){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const actionModal=document.getElementById('actionModal'),formModal=document.getElementById('formModal');
document.getElementById('fab').onclick=()=>actionModal.classList.add('show');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{actionModal.classList.remove('show');formModal.classList.remove('show')});
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>openForm(b.dataset.type));
function openForm(type){actionModal.classList.remove('show');formModal.classList.add('show');document.getElementById('entryType').value=type;document.getElementById('formTitle').textContent=({project:'Nuevo proyecto',note:'Nueva nota',task:'Nueva tarea',reminder:'Nuevo recordatorio'})[type];
 document.getElementById('projectField').style.display=type==='project'?'none':'block';document.getElementById('detailsField').style.display=type==='project'?'none':'block';
 const sel=document.getElementById('projectSelect');sel.innerHTML='<option value="">Sin proyecto</option>'+data.projects.map(p=>`<option value="${p.id}">${escapeHtml(p.title)}</option>`).join('');document.getElementById('entryForm').reset();document.getElementById('entryType').value=type;document.getElementById('keep').checked=true;}
document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();const type=document.getElementById('entryType').value;const title=document.getElementById('title').value.trim();const color=document.getElementById('color').value;
 if(type==='project'){data.projects.push({id:crypto.randomUUID(),title,color});}else{const pid=document.getElementById('projectSelect').value;const p=data.projects.find(x=>x.id===pid);data.entries.push({id:crypto.randomUUID(),type,title,details:document.getElementById('details').value.trim(),color,date:document.getElementById('dueDate').value||today(),keep:document.getElementById('keep').checked,projectId:pid,projectName:p?p.title:'',done:false});}
 save();formModal.classList.remove('show');render();};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body></html>
